<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Billing Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .calculator-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .receipt {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
            font-family: monospace;
            font-size: 15px;
            color: #444;
            display: none; /* Hidden until calculated */
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .total-row {
            font-weight: bold;
            font-size: 18px;
            color: #000;
            border-top: 1px solid #ccc;
            padding-top: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>TechMart Checkout</h2>
    
    <div class="form-group">
        <label for="custName">Customer Name</label>
        <input type="text" id="custName" value="Alex Doe">
    </div>
    
    <div class="form-group">
        <label for="itemPrice">Item Price ($)</label>
        <input type="number" id="itemPrice" min="0" step="0.01" placeholder="e.g. 80.00">
    </div>
    
    <div class="form-group">
        <label for="itemQty">Quantity</label>
        <input type="number" id="itemQty" min="1" value="1">
    </div>
    
    <button onclick="generateReceipt()">Calculate & Generate Bill</button>

    <div id="receiptBox" class="receipt">
        <div style="text-align: center; font-weight: bold; margin-bottom: 15px;">--- RECEIPT ---</div>
        <div class="receipt-row"><span>Customer:</span> <span id="rName"></span></div>
        <div class="receipt-row"><span>Item Subtotal:</span> <span id="rSubtotal"></span></div>
        <div class="receipt-row"><span>10% Discount:</span> <span id="rDiscount"></span></div>
        <div class="receipt-row"><span>Tax (8%):</span> <span id="rTax"></span></div>
        <div class="receipt-row total-row"><span>Total Due:</span> <span id="rTotal"></span></div>
    </div>
</div>

<script>
    // 1. Fixed Configuration Settings using const
    const TAX_RATE = 0.08;
    const DISCOUNT_THRESHOLD = 100;

    function generateReceipt() {
        // var: Function scoped store metadata
        var storeName = "TechMart";

        // Let: Block scoped variables for user inputs
        let price = parseFloat(document.getElementById('itemPrice').value) || 0;
        let quantity = parseInt(document.getElementById('itemQty').value) || 0;
        let customer = document.getElementById('custName').value || "Valued Customer";

        // Bundle data into an object to showcase destructuring
        const billData = { customer, price, quantity };

        // 2. Destructuring features
        const { price: p, quantity: q, customer: cName } = billData;

        // Calculations
        let subtotal = p * q;
        let discount = subtotal > DISCOUNT_THRESHOLD ? subtotal * 0.10 : 0;
        let tax = (subtotal - discount) * TAX_RATE;
        let total = subtotal - discount + tax;

        // 3. Template Literals inserting text into the DOM
        document.getElementById('rName').innerText = `${cName}`;
        document.getElementById('rSubtotal').innerText = `$${subtotal.toFixed(2)}`;
        document.getElementById('rDiscount').innerText = `-$${discount.toFixed(2)}`;
        document.getElementById('rTax').innerText = `+$${tax.toFixed(2)}`;
        document.getElementById('rTotal').innerText = `$${total.toFixed(2)}`;

        // Reveal the receipt styling layout
        document.getElementById('receiptBox').style.display = 'block';
    }
</script>

</body>
</html>
