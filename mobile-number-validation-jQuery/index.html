<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Mobile Number Validator</title>
    
    <!-- Load Tailwind CSS via CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Mobile Validator</h2>
        <p class="text-gray-600 text-sm mb-6">Enter an Indian mobile number (e.g. +91 9876543210 or 9876543210)</p>

        <form id="phoneForm" novalidate>
            <div class="mb-4">
                <label for="mobileNumber" class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                <input 
                    type="text" 
                    id="mobileNumber" 
                    placeholder="e.g. 9876543210" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                />
            </div>

            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
            >
                Validate Number
            </button>
        </form>

        <!-- Dynamic Output Box -->
        <div id="result" class="mt-4 p-3 rounded-lg hidden text-sm font-semibold text-center"></div>
    </div>

    <!-- External jQuery JS Script -->
    <script src="script.js"></script>
</body>
</html>
